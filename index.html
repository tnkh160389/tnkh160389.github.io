<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kich Quyen Vi - Lovely</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>body{font-family:Arial;text-align:center;padding:20px} .btn{width:100%;padding:18px;border-radius:12px;border:0;font-size:18px;font-weight:bold;background:#22c55e;color:#fff;margin:10px 0}</style>
</head>
<body>
<h2>Kich Quyen Vi Cho TK Con</h2>
<p>Mo bang Pi Browser - Bam nut duoi</p>
<button class="btn" onclick="grant()">🔑 CAP QUYEN VI wallet_address</button>
<div id="log" style="margin-top:20px;background:#000;color:#0f0;padding:10px;border-radius:8px;min-height:100px;white-space:pre-wrap;text-align:left">Chua chay...</div>
<script>
Pi.init({version:"2.0", sandbox:true});
async function grant(){
  document.getElementById('log').innerText="Dang xin quyen vi...";
  try{
    const auth = await Pi.authenticate(['username','payments','wallet_address'], ()=>{});
    document.getElementById('log').innerText=`✅ DA CAP QUYEN VI THANH CONG!
User: ${auth.user.username}
UID: ${auth.user.uid}
Scope: wallet_address da Allow
Xong! Thoat va bao admin thuongsheva pay!`;
  }catch(e){ document.getElementById('log').innerText="❌ Loi: "+e.message; }
}
</script>
</body>
</html>
