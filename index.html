<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<button onclick="grant()">1. CAP QUYEN VI</button>
<button onclick="pay()">2. PAY 5 UID</button>
<pre id="log"></pre>
<script>
Pi.init({version:"2.0",sandbox:true});
async function grant(){
let a=await Pi.authenticate(['payments','username','wallet_address'],x=>{}); 
log.innerText="OK "+a.user.uid
}
async function pay(){
log.innerText="Paying...";
let r=await fetch("/api/pay5uid",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:1})});
log.innerText=await r.text();
}
</script>
