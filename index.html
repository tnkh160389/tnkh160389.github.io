<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lovely Animals</title>
<meta name="description" content="Thiên nhiên, động vật &amp; chữa lành">
<meta property="og:title" content="Lovely Animals">
<meta property="og:description" content="Thiên nhiên, động vật &amp; chữa lành">
<meta property="og:image" content="images/hero-garden.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="top">
  <span class="logo">Lovely Animals</span>
</header>

<section class="hero">
  <img class="hero-img" src="images/hero-garden.jpg" alt="Vườn hoa">
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>
  <div class="hero-scrim" aria-hidden="true"></div>
  <div class="hero-text">
    <h1>Lovely Animals</h1>
    <p>Thiên nhiên, động vật &amp; chữa lành</p>
  </div>
</section>

<main>
  <section class="gallery" id="khoanh-khac">
    <h2 class="sec-title">Khoảnh khắc</h2>
    <div class="masonry">
      <figure class="item g1">
        <img src="images/lovely-cat.jpg" alt="Mèo cam" loading="lazy">
        <figcaption>Mèo cam</figcaption>
      </figure>
      <figure class="item g2">
        <video src="videos/clip-duckling.mp4" poster="images/duckling.jpg" autoplay muted loop playsinline preload="metadata"></video>
        <figcaption>Vịt con</figcaption>
      </figure>
      <figure class="item g3">
        <img src="images/rabbit.jpg" alt="Thỏ trắng" loading="lazy">
        <figcaption>Thỏ trắng</figcaption>
      </figure>
      <figure class="item g4">
        <img src="images/fawn.jpg" alt="Nai con" loading="lazy">
        <figcaption>Nai con</figcaption>
      </figure>
      <figure class="item g5">
        <video src="videos/clip-panda.mp4" poster="images/lovely-panda.jpg" autoplay muted loop playsinline preload="metadata"></video>
        <figcaption>Gấu trúc</figcaption>
      </figure>
      <figure class="item g6">
        <img src="images/fox.jpg" alt="Cáo đỏ" loading="lazy">
        <figcaption>Cáo đỏ</figcaption>
      </figure>
      <figure class="item g1">
        <img src="images/kitten.jpg" alt="Mèo trắng" loading="lazy">
        <figcaption>Mèo trắng</figcaption>
      </figure>
      <figure class="item g2">
        <img src="images/hummingbird.jpg" alt="Chim ruồi" loading="lazy">
        <figcaption>Chim ruồi</figcaption>
      </figure>
      <figure class="item g3">
        <video src="videos/clip-corgi.mp4" poster="images/lovely-corgi.jpg" autoplay muted loop playsinline preload="metadata"></video>
        <figcaption>Corgi</figcaption>
      </figure>
      <figure class="item g4">
        <img src="images/hedgehog.jpg" alt="Nhím" loading="lazy">
        <figcaption>Nhím</figcaption>
      </figure>
      <figure class="item g5">
        <img src="images/puppy.jpg" alt="Cún con" loading="lazy">
        <figcaption>Cún con</figcaption>
      </figure>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="foot-name">Lovely Animals</div>
  <a class="foot-link" href="https://nightzone.vercel.app">NightZone</a>
</footer>

<script src="js/main.js"></script>
</body>
</html>
