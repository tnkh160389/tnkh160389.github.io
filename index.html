<script>
  const PI_API_KEY = "kdtsahzvox5at3nytsm3rkdfmdwykyittodmenhzvgrf9n0bl8bswbp1oinmsxjm"; 
  async function testPay() {
    try {
      const auth = await Pi.authenticate(['payments'], ()=>{});
      await Pi.createPayment({
        amount: 0.1,
        memo: "Test Lovely Animals",
        metadata: { orderId: "lovely-test-001" }
      }, {
        onReadyForServerApproval: async (paymentId) => {

        },
        onCancel: (id) => { alert("Đã hủy"); },
        onError: (e) => { alert("Lỗi: " + e); }
      });
    } catch(e) { alert(e); }
  }
  document.getElementById('payBtn').addEventListener('click', testPay);
</script>
