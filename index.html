<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovely Animals - Fresh Sandbox Final</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
  body { font-family: system-ui; text-align: center; padding: 16px; background: #f9fafb; }
  .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
  .btn { width: 100%; padding: 14px; border-radius: 12px; border: 0; font-size: 15px; font-weight: 800; margin: 8px 0; cursor: pointer; }
  .green { background: #22c55e; color: white; } .purple { background: #7c3aed; color: white; }
  .orange { background: #f59e0b; color: white; } .red { background: #ef4444; color: white; }
  .box { background: #0b0f19; color: #00ff88; text-align: left; padding: 14px; border-radius: 12px; font-family: monospace; white-space: pre-wrap; min-height: 160px; margin-top: 15px; font-size: 12px; overflow-x: auto; }
  #status { padding: 10px; border-radius: 10px; background: #fef3c7; color: #92400e; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <h2>🐾 Lovely Animals - Fresh</h2>
  <div id="status">Sẵn sàng - 5 UID chuẩn đã lock</div>
  <button class="btn red" onclick="resetSandboxSession()">🔄 1. XÓA CACHE PI BROWSER (Fix 207)</button>
  <button class="btn green" onclick="capQuyen()">🔑 2. Xác thực Sandbox</button>
  <button class="btn purple" onclick="payLovelyAnimals()">🚀 3. Thanh toán 5 UID</button>
  <div id="log" class="box">5 UID CHUẨN:
- 42e4b976-a279-43e3-afc1-3f3e75db0e16
- 42e3690a-ca9d-4726-bc94-43abd7cecb60
- 6d7867e6-9abb-4f76-9cb4-85e146eee486
- 6b6080ea-081c-4e34-8b81-91fd173b7c36
- a46fa764-7725-4f23-bbfc-554b358e33d3
</div>
</div>

<script>
Pi.init({ version: "2.0", sandbox: true });

const BACKEND_URL = 'https://tnkh160389.vercel.app/api/pay5uid' // ĐÚNG - Vercel mới chạy API
// Nếu Vercel bro là tnkh160389githubio.vercel.app thì dùng cái này:
// const BACKEND_URL = 'https://tnkh160389githubio.vercel.app/api/pay5uid'

const FINAL_5_UIDS = [
  "42e4b976-a279-43e3-afc1-3f3e75db0e16",
  "42e3690a-ca9d-4726-bc94-43abd7cecb60",
  "6d7867e6-9abb-4f76-9cb4-85e146eee486",
  "6b6080ea-081c-4e34-8b81-91fd173b7c36",
  "a46fa764-7725-4f23-bbfc-554b358e33d3"
];
const SCOPES = ['username', 'payments', 'wallet_address'];
let currentUser = null;

function log(m){ document.getElementById('log').innerText += "\n"+m; }
function setStatus(msg, ok=false){
  const s=document.getElementById('status'); s.innerText=msg;
  s.style.background=ok?"#dcfce7":"#fef3c7"; s.style.color=ok?"#166534":"#92400e";
}

function resetSandboxSession(){
  try{ localStorage.clear(); sessionStorage.clear(); currentUser=null; }catch(e){}
  if('caches' in window){ caches.keys().then(ns=>ns.forEach(n=>caches.delete(n))); }
  if(indexedDB.databases){ indexedDB.databases().then(dbs=>dbs.forEach(db=>indexedDB.deleteDatabase(db.name))); }
  log("🧹 Đã xóa cache Pi Browser...");
  setTimeout(()=> location.replace(location.href.split('?')[0]+'?cb='+Date.now()), 900);
}

async function capQuyen(){
  document.getElementById('log').innerText="Đang xác thực...";
  try{
    const auth = await Pi.authenticate(SCOPES, onIncompletePaymentFound);
    currentUser = auth.user;
    setStatus("Đã kết nối: "+auth.user.username, true);
    document.getElementById('log').innerText = `✅ OK: ${auth.user.username}\nUID: ${auth.user.uid}\nSẵn sàng pay 5 UID chuẩn`;
  }catch(e){ document.getElementById('log').innerText="❌ Auth fail: "+e.message; }
}

function onIncompletePaymentFound(p){ console.log(p); return p; }

async function payLovelyAnimals(){
  if(!currentUser){ alert("Bấm nút 2 trước!"); return; }
  log("🚀 Gửi "+FINAL_5_UIDS.length+" UID tới "+BACKEND_URL);
  try{
    const r = await fetch(BACKEND_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({uids: FINAL_5_UIDS, amount:1})
    });
    const data = await r.json();
    log("STATUS "+r.status+"\n"+JSON.stringify(data,null,2));
    if(data.successCount===5) setStatus(`THÀNH CÔNG 5/5 🎉`, true);
    else setStatus(`${data.successCount||0}/${data.total||5} - check Request Logs`, false);
  }catch(e){ log("❌ Fetch lỗi: "+e.message); }
}
</script>
</body>
</html>
