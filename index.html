<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lovely Animals - A2U Test</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{background:#000;color:#fff;font-family:monospace;margin:0;padding:16px}
.card{max-width:380px;margin:0 auto;background:#0a0a0a;border:1px solid #ff69b4;border-radius:12px;padding:16px}
h1{font-size:15px;text-align:center;color:#ff69b4;margin:0 0 12px}
.badge{text-align:center;color:#ff69b4;font-size:12px;margin-bottom:12px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:700;margin-top:10px;cursor:pointer}
.btn-pink{background:#ff69b4;color:#000}
.btn-purple{background:#6c5ce7;color:#fff}
.log{background:#000;color:#00ff88;border:1px solid #333;border-radius:8px;padding:10px;margin-top:14px;font-size:11px;min-height:140px;white-space:pre-wrap;word-break:break-all}
.small{font-size:10px;color:#888;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>🐶 Lovely Animals - A2U Test<br>Pay 5 UIDs</h1>
<div class="badge" id="status">🌐 Mở bằng Pi Browser - Sandbox</div>
<button class="btn btn-pink" onclick="approve()">1. 🔑 Cấp quyền ví 5 ĐT</button>
<button class="btn btn-purple" onclick="pay5()">2. 💸 Test Pay 5 UIDs - LovelyAnimals</button>
<div id="log" class="log">Log:
- Ready. lovelyanimals.pi
- Chờ cấp quyền...
</div>
<div class="small">lovelyanimals.pi - Part of LocalPi HCM<br>No Commerce - Chỉ test hạ tầng A2U</div>
</div>
<script>
let PiReady=false;
function log(t){const l=document.getElementById('log');l.textContent+="\n"+t;l.scrollTop=9999;}
window.addEventListener('load',()=>{if(window.Pi){Pi.init({version:"2.0",sandbox:true});PiReady=true;document.getElementById('status').textContent="✅ Pi SDK Ready - LovelyAnimals";log("Pi SDK Ready");}});
async function approve(){
 if(!window.Pi){alert("Mở Pi Browser bro!");return;}
 try{const s=await Pi.authenticate(['username','payments'],()=>{});log("✅ Approve OK: @"+s.user.username);}catch(e){log("❌ "+e.message);}
}
async function pay5(){
 log("🚀 LovelyAnimals - Chạy Pay 5 UIDs...");
 try{
  const r=await fetch("/api/pay5uid",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:1})});
  const data=await r.json();
  log(`\nsuccess: ${data.success}\ntotal: ${data.total}`);
  data.results.forEach(x=>{log(`${x.success?"✅":"❌"} ${x.uid.slice(0,6)}... ${x.success?"OK":JSON.stringify(x.details||x.error).slice(0,80)}`);});
  if(data.success) log("\n🔥 5/5 THÀNH CÔNG - LOVELYANIMALS OK!");
  document.getElementById('status').textContent=data.success?"✅ Pay thành công! 5/5 OK - LovelyAnimals":"⚠️ Check log";
 }catch(e){log("❌ Lỗi: "+e.message);}
}
</script>
</body>
</html>
