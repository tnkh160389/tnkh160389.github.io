<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovely Animals - Sandbox Pay 5 UIDs</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body { font-family: monospace; background: #0a0a0a; color: #0f0; padding: 15px; padding-top: 20px; margin: 0; }
h2 { font-size: 16px; }
.btn { width: 100%; padding: 14px; border-radius: 8px; border: 0; font-size: 15px; font-weight: bold; margin: 8px 0; cursor: pointer; }
.green { background: #22c55e; color: white; }
.purple { background: #7c3aed; color: white; }
#log { background: #000; color: #00ff88; text-align: left; padding: 12px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; height: 350px; overflow: auto; margin-top: 10px; font-size: 12px; border: 1px solid #0f0; }
</style>
</head>
<body>

<h2>🐾 Lovely Animals - Sandbox Pay 5 UIDs</h2>
<div id="status" style="color: #eab308; font-weight: bold; margin: 10px">Sẵn sàng Sandbox</div>

<button class="btn green" id="btnLogin">1. Xác thực Pi SDK (Sandbox)</button>
<button class="btn purple" id="btnPay">2. Thanh toán Sandbox 5 UID</button>

<div id="log">Sẵn sàng...</div>

<script>
Pi.init({ version: "2.0", sandbox: true });

const BACKEND_URL = 'https://tnkh160389githubio.vercel.app/api/pay5uid';

// 5 UID chính chủ của Lovely Animals
const TARGET_UIDS = [
  { username: "Target_1", uid: "42e4b976-a279-43e3-afc1-3f3e75db0e16" },
  { username: "Target_2", uid: "42e3690a-ca9d-4726-bc94-43abd7cecb60" },
  { username: "Target_3", uid: "6d7867e6-9abb-4f76-9cb4-85e146eee486" },
  { username: "Target_4", uid: "6b6080ea-081c-4e34-8b81-91fd173b7c36" },
  { username: "Target_5", uid: "a46fa764-7725-4f23-bbfc-554b358e33d3" }
];

function addLog(m) {
  let el = document.getElementById('log');
  el.textContent += "\n[" + new Date().toLocaleTimeString() + "] " + m;
  el.scrollTop = el.scrollHeight;
}

document.getElementById('btnLogin').onclick = async () => {
  try {
    addLog("⏳ Đang kết nối Pi SDK Sandbox...");
    let auth = await Pi.authenticate(['username', 'payments', 'wallet_address'], (p) => {
      console.log("Incomplete payment:", p);
    });
    addLog(`✅ XÁC THỰC THÀNH CÔNG: @${auth.user.username} (${auth.user.uid})`);
    document.getElementById('status').innerText = "OK: " + auth.user.username;
  } catch (e) {
    addLog("❌ LỖI XÁC THỰC: " + e.message);
  }
};

document.getElementById('btnPay').onclick = async () => {
  addLog("🚀 BẮT ĐẦU BẮN 5 UID LOVELY ANIMALS...");
  
  for (let i = 0; i < TARGET_UIDS.length; i++) {
    let u = TARGET_UIDS[i];
    addLog(`⏳ [${i+1}/5] Đang chuyển cho ${u.username} (${u.uid.substring(0,8)}...)`);
    
    try {
      let r = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: u.uid, username: u.username, amount: 1 })
      });
      
      let res = await r.json();
      if (r.ok) {
        addLog(`✅ [${i+1}/5] ${u.username} THÀNH CÔNG! PaymentID: ${res.paymentId || 'OK'}`);
      } else {
        addLog(`❌ [${i+1}/5] THẤT BẠI: ${JSON.stringify(res)}`);
      }
    } catch (err) {
      addLog(`❌ Lỗi mạng: ${err.message}`);
    }
    
    await new Promise(r => setTimeout(r, 1200));
  }
  
  addLog("🎉 HOÀN TẤT BATCH THANH TOÁN 5 UID!");
  document.getElementById('status').innerText = "HOÀN TẤT BATCH";
};
</script>
</body>
</html>
