<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lovely Animals - CHECK 1021<title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui}
.box{max-width:380px;margin:20px auto;padding:15px;text-align:center}
h3{margin:0 0 10px;color:#00ff88}
#status{font-weight:bold;margin:10px 0;padding:8px;border-radius:6px;background:#1a1a1a;color:#00c851}
button{width:100%;padding:14px;border:none;border-radius:10px;margin-bottom:12px;font-weight:bold;font-size:15px;cursor:pointer}
#b1{background:#00c851;color:#fff}
#b2{background:#7b2cbf;color:#fff}
#log{background:#000;color:#00ff88;font-family:monospace;font-size:12px;text-align:left;padding:10px;border-radius:8px;min-height:120px;white-space:pre-wrap;overflow:auto;border:1px solid #333}
</style>
</head>
<body>
<div class="box">
  <h3>🌸 Lovely Animals<br>Trùm cuối (Pay 5 UIDs)</h3>
  <div id="status">Chưa chạy</div>

  <button id="b1" onclick="capQuyenVi()">🔑 1. Cấp quyền ví (bấm trên TỪNG ĐT)</button>
  <button id="b2" onclick="pay()">🚀 2. Chạy Pay 5 UIDs ngay</button>

  <div id="log">Chờ...</div>
</div>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
// Fix 1: Đồng bộ init chuẩn như Nightzone (bỏ sandbox: true)
Pi.init({version:"2.0"});

async function capQuyenVi(){
  try{
    const auth = await Pi.authenticate(['username','payments','wallet_address'], p=>{});
    document.getElementById('status').innerText = "✅ Đã cấp: " + auth.user.username;
    document.getElementById('log').innerText = "✅ Cấp quyền OK\nUID: " + auth.user.uid;
  }catch(e){ alert(e.message); }
}

async function pay(){
  const log = document.getElementById('log');
  const st = document.getElementById('status');
  log.innerText = "Đang bắn 5 UIDs...\n";
  st.innerText = "⏳ Đang xử lý...";

  try {
    const res = await fetch('/api/pay5uid', {method:'POST'});
    const data = await res.json();
    
    // Log hiển thị gọn gàng chuẩn Lumia909 / Nightzone
    let txt = `success: ${data.success}\ntotal: ${data.total}\n\n`;
    if(Array.isArray(data.results)){
      data.results.forEach(r=>{
        const short = r.uid ? r.uid.slice(0,6) : "UNKNOWN";
        txt += r.success ? `✅ ${short}... OK\n` : `❌ ${short}... ${r.error||"Fail"}\n`;
      });
    }
    txt += `\n${data.success ? "🎉 5/5 THÀNH CÔNG - TRÙM CUỐI!" : "Thử lại"}`;
    
    log.innerText = txt;
    st.innerText = data.success ? "🎉 Pay thành công! 5/5 OK" : "Fail";
  } catch(err) {
    st.innerText = "❌ Lỗi kết nối";
    log.innerText = "Lỗi fetch: " + err.message;
  }
}
</script>
</body>
</html>
