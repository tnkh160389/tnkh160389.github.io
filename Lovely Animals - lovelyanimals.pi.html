<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lovely Animals - lovelyanimals.pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fef9f3;margin:0;padding:20px;color:#4a3a2a}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:22px;text-align:center}
.badge{display:inline-block;background:#6c5ce7;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer}
.btn-pi{background:#6c5ce7;color:#fff}
.btn-pay{background:#ff7675;color:#fff}
.log{background:#f7f3ef;border-radius:10px;padding:12px;margin-top:16px;font-size:13px;min-height:80px;white-space:pre-wrap;word-break:break-all}
.small{font-size:12px;color:#888;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>🐶 Lovely Animals 🐱<br><span class="badge">lovelyanimals.pi</span></h1>
<p style="text-align:center;font-size:14px">Healing podcast & cute gallery - Pi Test</p>
<div id="status" class="small">Checking Pi Browser...</div>
<button class="btn btn-pi" onclick="auth()">1. Connect Pi Wallet</button>
<button class="btn btn-pay" onclick="pay()">2. Test Payment 0.1 Pi</button>
<div id="log" class="log">Log:
- Ready. Open in Pi Browser to test real Pi.
</div>
<div class="small">Domain: lovelyanimals.pi -> tnkh160389.github.io<br>Amount: 0.1 Pi (testnet/mainnet)</div>
</div>
<script>
let PiReady=false;
let user=null;
function log(t){document.getElementById('log').textContent+="\n"+new Date().toLocaleTimeString()+": "+t;}

window.addEventListener('load',()=>{
  setTimeout(()=>{
    if(window.Pi){
      try{Pi.init({version:"2.0",sandbox:false});PiReady=true;
      document.getElementById('status').textContent="✅ Pi SDK Ready - Mainnet";
      log("Pi SDK initialized");}
      catch(e){document.getElementById('status').textContent="⚠️ Browser mode";log("Init error: "+e);}
    }else{
      document.getElementById('status').textContent="🌐 Browser mode - Open in Pi Browser for real test";
      log("Not in Pi Browser - demo mode only");
    }
  },500);
});

async function auth(){
  if(!window.Pi||!PiReady){log("Demo: Pi not available. Open in Pi Browser.");alert("Mở bằng Pi Browser để connect ví thật bro!");return;}
  try{
    const scopes=['username','payments','wallet_address'];
    function onIncomplete(p){log("Incomplete payment: "+p.identifier);}
    const authRes=await Pi.authenticate(scopes,onIncomplete);
    user=authRes;
    log("Auth OK: @"+authRes.user.username+" | wallet: "+(authRes.user.wallet_address||'N/A').slice(0,10)+"...");
    alert("Connect OK: @"+authRes.user.username);
  }catch(e){log("Auth fail: "+e.message);alert("Auth fail: "+e.message);}
}

async function pay(){
  if(!window.Pi||!PiReady){log("Demo pay 0.1 Pi - would call Pi.createPayment in Pi Browser");alert("Demo thôi bro - vào Pi Browser mới pay thật được");return;}
  try{
    log("Creating 0.1 Pi payment...");
    const payment=await Pi.createPayment({
      amount:0.1,
      memo:"Lovely Animals test - 0.1 Pi",
      metadata:{type:"test",domain:"lovelyanimals.pi"}
    },{
      onReadyForServerApproval:(id)=>{log("Approval needed: "+id);fetch("/approve",{method:"POST",body:JSON.stringify({id})});},
      onReadyForServerCompletion:(id,txid)=>{log("Completion: "+id+" tx: "+txid);},
      onCancel:(id)=>{log("Payment canceled: "+id);},
      onError:(e,id)=>{log("Payment error: "+e+" id: "+id);}
    });
    log("Payment created: "+JSON.stringify(payment));
  }catch(e){log("Pay fail: "+e.message);}
}
</script>
